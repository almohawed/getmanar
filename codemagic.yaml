workflows:
  # ─── iOS Build & App Store ────────────────────────────────────────────────
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 90
    instance_type: mac_mini_m1

    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: 1.15.2
      groups:
        - app_store_credentials
        - certificate_credentials
      vars:
        BUNDLE_ID: "com.almohawed.manar"
        APP_STORE_APP_ID: "6744042607"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
          echo "Code signing configured"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Clean iOS build
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          cd ..

      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Flutter build IPA
        script: |
          # Build number = seconds since epoch (always increasing, always unique)
          BUILD_NUM=$(date +%s)
          echo "Building with build number: $BUILD_NUM"
          flutter build ipa --release \
            --build-name=3.0.0 \
            --build-number=$BUILD_NUM \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ─── Android Build (AAB + APK) ────────────────────────────────────────────
  android-release:
    name: Android Release (AAB + APK)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: 3.32.0

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build AAB (Google Play)
        script: |
          BUILD_NUM=$(date +%s)
          flutter build appbundle --release \
            --build-name=3.0.0 \
            --build-number=$BUILD_NUM

      - name: Build APK (Huawei AppGallery)
        script: |
          BUILD_NUM=$(date +%s)
          flutter build apk --release \
            --build-name=3.0.0 \
            --build-number=$BUILD_NUM

      - name: Rename APK to manar.apk
        script: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/manar.apk

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/manar.apk
      - flutter_drive.log
