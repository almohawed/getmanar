workflows:
  # ─── iOS Build & App Store ────────────────────────────────────────────────
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 90
    instance_type: mac_mini_m1

    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: 1.15.2
      groups:
        - app_store_credentials   # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
        - certificate_credentials # CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.almohawed.manar"
        APP_STORE_APP_ID: "6744042607"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Clean iOS build
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          cd ..

      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --build-name=3.0.0 \
            --build-number=50 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
