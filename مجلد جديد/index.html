<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منصة منار التعليمية لإدارة المدارس والطلاب - نظام ذكي متكامل">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="منار">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="منصة منار التعليمية">
  <meta property="og:description" content="منصة منار التعليمية لإدارة المدارس والطلاب - نظام ذكي متكامل">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Google Sign-In (Required for Web Auth) -->
  <!-- <meta name="google-signin-client_id" content="YOUR_CLIENT_ID.apps.googleusercontent.com"> -->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>منصة منار التعليمية</title>
  <link rel="manifest" href="manifest.json">
  
  <script>
    // Global Error Handler to show errors on screen instead of white screen
    window.onerror = function(message, source, lineno, colno, error) {
      var loader = document.getElementById('loading_indicator');
      if (loader) loader.style.display = 'none';
      
      var errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '0';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.height = '100%';
      errorDiv.style.backgroundColor = 'white';
      errorDiv.style.color = 'red';
      errorDiv.style.padding = '20px';
      errorDiv.style.zIndex = '10000';
      errorDiv.style.overflow = 'auto';
      errorDiv.innerHTML = '<h1>Something went wrong</h1><h3>' + message + '</h3><pre>' + (error && error.stack ? error.stack : '') + '</pre>';
      document.body.appendChild(errorDiv);
    };
  </script>
</head>
<body>
  <div id="loading_indicator" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column;">
    <img src="logo.png" alt="منصة منار" style="width: 150px; margin-bottom: 24px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
    <div style="display:none; font-size: 60px; margin-bottom: 20px;">🏫</div>
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #1A237E; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </div>
  <script>
    // Safety timeout: Remove loading screen if app takes too long (e.g. 15 seconds)
    // And show a reload button
    setTimeout(function() {
      var loader = document.getElementById('loading_indicator');
      if (loader && loader.style.display !== 'none') {
        console.warn('Loading took too long.');
        var msg = document.createElement('div');
        msg.innerHTML = '<p style="color:black; margin-top:20px;">استغرق التحميل وقتاً طويلاً..</p><button onclick="window.location.reload()" style="padding:10px 20px; cursor:pointer;">إعادة التحميل</button>';
        loader.appendChild(msg);
      }
    }, 15000);
  </script>
  
  <!-- Force HTML renderer to avoid CanvasKit CORS/Download issues -->
  <!-- <script>
    window.flutterWebRenderer = "html";
  </script> -->

  <!-- Force HTML renderer configuration -->
  <script>
    window.flutterWebRenderer = "html";
    window.flutterConfiguration = {
      renderer: "html"
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
